name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  clj:
    name: CLJ (kaocha + guardrails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: latest

      - name: Cache Maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: clj-${{ hashFiles('deps.edn') }}
          restore-keys: clj-

      - name: Run kaocha
        run: clojure -J-Dguardrails.enabled=true -J-Dguardrails.config=guardrails-test.edn -M:dev:test:clj-tests

  cljs:
    name: CLJS (shadow-cljs + karma)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: latest

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Cache Maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: cljs-${{ hashFiles('deps.edn') }}-${{ hashFiles('package.json') }}
          restore-keys: cljs-

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Compile ci-tests
        run: pnpm exec shadow-cljs -A:dev -v compile ci-tests

      - name: Run karma
        run: pnpm exec karma start --single-run

  bb:
    name: babashka (smoke + bb test suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Clojure CLI + babashka
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: latest
          bb: latest

      - name: Cache Maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: bb-${{ hashFiles('test-bb/bb-tests.edn', 'deps.edn') }}
          restore-keys: bb-

      - name: Run bb smoke + test suite
        run: |
          cd test-bb
          bb smoke.clj
          bb --config bb-tests.edn -f run-tests.clj
